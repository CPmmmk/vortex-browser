<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vortex Browser</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: -1px;
        }
        
        .v-v { color: #ff3333; }
        .v-o { color: #ffbb00; }
        .v-r { color: #33bbff; }
        .v-t { color: #33cc66; }
        .v-e { color: #ff3333; }
        .v-x { color: #aa66ff; }

        p {
            color: #888;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .search-box {
            width: 500px;
            max-width: 90%;
            padding: 15px 20px;
            font-size: 1rem;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 30px;
            color: white;
            outline: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .search-box:focus {
            border-color: #ffbb00;
        }
    </style>
</head>
<body>
    <h1>
        <span class="v-v">V</span><span class="v-o">o</span><span class="v-r">r</span><span class="v-t">t</span><span class="v-e">e</span><span class="v-x">x</span>
    </h1>
    <p>Leve, rápido e focado em desempenho.</p>
    <input type="text" class="search-box" placeholder="Pesquisar na Web ou digitar URL..." autofocus onkeydown="if(event.key === 'Enter'){ window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(this.value); }">
</body>
</html>
